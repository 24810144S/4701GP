<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">入學要求 - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1>入學要求及申請截止日期</h1>
    <section>
        <h2>各課程入學要求</h2>
        <table class="info-table">
            <thead>
            <tr><th>課程</th><th>申請截止日期</th><th>入學要求</th></tr>
            </thead>
            <tbody>
            <tr th:each="info : ${admissionInfo}">
                <td th:text="${info.programme}"></td>
                <td th:text="${info.deadline}"></td>
                <td th:text="${info.requirements}"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section>
        <h2>各年級名額上限（S1–S6）</h2>
        <table class="seat-table">
            <thead>
            <tr><th>年級</th><th>DSE 名額</th><th>IB 名額</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${seatTable}">
                <td th:text="${row.level}"></td>
                <td th:text="${row.dseSeats}"></td>
                <td th:text="${row.ibSeats}"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="apply-section">
        <a th:href="@{/login}" class="btn-apply">Apply / 申請入學</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
