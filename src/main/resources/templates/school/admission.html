<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Admission Requirements - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1>Admission Requirements and Application Deadlines</h1>
    <section>
        <h2>Admission Requirements by Programme</h2>
        <table class="info-table">
            <thead>
            <tr><th>Programme</th><th>Application Deadline</th><th>Admission Requirements</th></tr>
            </thead>
            <tbody>
            <tr th:each="info : ${admissionInfo}">
                <td th:text="${info.programme}"></td>
                <td th:text="${info.deadline}"></td>
                <td th:text="${info.requirements}"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section>
        <h2>Seat Limits by Level (S1–S6)</h2>
        <table class="seat-table">
            <thead>
            <tr><th>Level</th><th>DSE Seats</th><th>IB Seats</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${seatTable}">
                <td th:text="${row.level}"></td>
                <td th:text="${row.dseSeats}"></td>
                <td th:text="${row.ibSeats}"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="apply-section">
        <a th:href="@{/login}" class="btn-apply">Apply Now</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
