<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">School Overview - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<div class="header">
    <div class="logo">CIS · Christian International School</div>
    <div class="nav">
        <a href="/school/about">About Us</a>
        <a href="/school/facilities">Facilities</a>
        <a href="/school/programmes">Programmes</a>
        <a href="/school/courses">Courses</a>
        <a href="/school/admission-requirements">Admission & Quotas</a>
    </div>
</div>
<main class="container">
    <h1>School Overview</h1>
    <p>Christian International School (CIS) is a newly established international school in Hong Kong providing quality secondary education from S1 to S6.</p>
    <h2>Teaching Staff</h2>
    <div class="card-grid">
        <div th:each="teacher : ${teachers}" class="card">
            <h3 th:text="${teacher.name}"></h3>
            <p th:text="${teacher.title}"></p>
            <p th:text="${teacher.qualification}"></p>
        </div>
    </div>
</main>
</body>
</html>
