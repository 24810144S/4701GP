<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">學校概況 - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1>學校概況</h1>
    <section>
        <h2>學校背景</h2>
        <p>Christian International School (CIS) 是一所位於香港的新成立國際學校，提供中一至中六高質素中學教育，致力培養學生的學術能力、品格與國際視野。</p>
    </section>
    <section>
        <h2>位置地圖</h2>
        <div class="map-placeholder">
            <p>（地圖圖片佔位）</p>
        </div>
    </section>
    <section>
        <h2>教師資料</h2>
        <div class="teacher-list">
            <div th:each="teacher : ${teachers}" class="teacher-card">
                <h3 th:text="${teacher.name}"></h3>
                <p th:text="${teacher.title}"></p>
                <p th:text="${teacher.qualification}"></p>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
