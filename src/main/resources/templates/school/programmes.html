<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Programmes - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<main class="container">
    <h1>CIS Secondary School Programmes</h1>
    <div class="programme-list">
        <div th:each="prog : ${programmes}" class="programme-card">
            <h2 th:text="${prog.name}"></h2>
            <p th:text="${prog.description}"></p>
        </div>
    </div>
</main>
</body>
</html>
