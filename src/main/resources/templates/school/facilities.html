<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">School Facilities - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1>School Facilities and Laboratories</h1>
    <div class="facility-list">
        <div th:each="facility : ${facilities}" class="facility-item">
            <h3 th:text="${facility.name}"></h3>
            <p th:text="${facility.description}"></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
