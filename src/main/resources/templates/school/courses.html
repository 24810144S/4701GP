<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Course Descriptions - CIS</title>
    <link rel="stylesheet" th:href="@{/css/school.css}">
</head>
<body>
<main class="container">
    <h1>Course Content Descriptions</h1>
    <div class="course-list">
        <div th:each="course : ${courses}" class="course-item">
            <h3 th:text="${course.level}"></h3>
            <p th:text="${course.content}"></p>
        </div>
    </div>
</main>
</body>
</html>
