spring.application.name=4701gp
spring.datasource.url=${SAS_DB_URL:jdbc:mysql://localhost:3306/4701gp_dev}
spring.datasource.username=${SAS_DB_USERNAME:root}
spring.datasource.password=${SAS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.port=8080

sas.dev.admin-email=${SAS_ADMIN_EMAIL:admin@cis.example}
sas.dev.admin-password=${SAS_ADMIN_PASSWORD:}
# Mail Configuration (Gmail SMTP or Custom SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:admissions@cis.edu.hk}